<header class="cabecalho">

    <div class="container">

        <div class="header-principal">

            <!-- Logo e nome -->
            <div class="marca">
                <img 
                    src="logotipo.png"
                    id="logotipo"
                    alt="Caminhos do Brasil">

                <span>Caminhos do Brasil</span>
            </div>


           

            
           <!-- Links -->
            <button routerLink="/login" class="btn-entrar" *ngIf="nomeCliente() == ''">
                Entrar
            </button>

            <!-- Cliente logado -->
            <div class="usuario-logado" *ngIf="nomeCliente() != ''">
                <span>Olá, {{nomeCliente()}}</span>
                <a routerLink="/cadastro" class="link-meus-dados">Meus dados</a>
                <button class="btn-entrar" (click)="sair()">Sair</button>
            </div>

        </div>


        <!-- Menu inferior -->
        <div class="menu-inferior">

            <a routerLink="/">Início</a>
            <a routerLink="/cesta">Cesta</a>
            <a routerLink="/destaque">Destaques</a>
            <a routerLink="/sobrenos">Sobre nós</a>
           

        </div>

    </div>

</header>
<main class="conteudo">
   <router-outlet></router-outlet> 
</main>
  

<footer class="rodape text-center py-3">

    <h5>Caminhos do Brasil</h5>

    <p class="mb-1">Entre em contato: saccaminhos@gmail.com</p>

    <p class="mb-1">Telefone: (11) 93455-1288</p>

    <p class="mb-1">Instagram: @caminhosdoBrasil</p>

    <p class="mt-3 mb-0">
        © 2026 Caminhos do Brasil
    </p>

</footer>
