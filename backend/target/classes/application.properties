spring.application.name=caminhos
server.port=8081


spring.datasource.url=jdbc:postgresql://ep-raspy-sun-bdxaa59l-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
## Troque pela senha do Neon (Dashboard > Connect > clique no olho para ver a senha)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

## O plano grátis do Neon "dorme" quando fica parado
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
